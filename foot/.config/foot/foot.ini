# ════════════════════════════════════════════════════════════════════════════
#  ~/.config/foot/foot.ini   ·   TokyoNight Storm   ·   foot 1.27
#  Fast by default (Wayland, no compositing overhead). Tweaks below are crisp
#  + performant, not cargo-cult. `man 5 foot` documents every key.
# ════════════════════════════════════════════════════════════════════════════

[main]
font=CaskaydiaCove Nerd Font Mono:size=16:weight=Regular
font-bold=CaskaydiaCove Nerd Font Mono:size=16:weight=Bold
font-italic=CaskaydiaCove Nerd Font Mono:size=16:slant=italic
font-bold-italic=CaskaydiaCove Nerd Font Mono:size=16:weight=Bold:slant=italic
line-height=19
letter-spacing=0
pad=18x14 center

# Let foot set TERM=foot so neovim gets full capability info (synchronized
# output, proper color ops). Override with xterm-256color only for SSH.
term=foot

# foot renders box-drawing / block chars itself → seamless borders in btop,
# tmux, nvim splits, and slightly faster than shaping them through the font.
box-drawings-uses-font-glyphs=no

# Underlines (links, undercurl) sit just below the baseline, not clipping glyphs.
underline-offset=2

[scrollback]
lines=10000
multiplier=3
# Little position marker on the right edge while scrolling back.
indicator-position=relative
indicator-format=line

[cursor]
style=block
blink=yes
blink-rate=600
# Hollow outline when the window loses focus — instantly see which pane is live.
unfocused-style=hollow

# ── TokyoNight Storm ─────────────────────────────────────────────────────────
# foot picks [colors-dark] by default (and whenever the desktop reports a dark
# preference), so this is effectively unconditional.
[colors-dark]
foreground=a9b1d6
background=1a1b26
alpha=0.78
# alpha is per-cell, not per-window. Mode `default` skips every cell an app painted
# with an explicit bg escape — that is why btop/nvim looked opaque. `matching` also
# lets alpha through for cells whose bg RGB equals `background` above.
alpha-mode=matching

selection-foreground=c0caf5
selection-background=28344a

# <text-under-cursor> <cursor-block>. Lavender-purple block; swap bb9af7 for
# 7aa2f7 (blue), ff9e64 (orange) or c0caf5 (white) to taste.
cursor=1a1b26 bb9af7

# Clickable URLs + the letter labels shown in url-mode (Ctrl+Shift+u).
urls=bb9af7
jump-labels=1a1b26 e0af68

# Incremental-search box (Ctrl+Shift+r): current match vs. other matches.
search-box-match=1a1b26 7aa2f7
search-box-no-match=c0caf5 f7768e

# Visual-bell flash colour (only used if [bell] visual=yes).
flash=ff9e64

# dim / black
regular0=414868
# red
regular1=f7768e
# green
regular2=9ece6a
# yellow
regular3=e0af68
# blue
regular4=7aa2f7
# magenta
regular5=ad8ee6
# cyan
regular6=449dab
# white
regular7=a9b1d6

# bright variants
bright0=565f89
bright1=ff7a93
bright2=b9f27c
bright3=ff9e64
bright4=7da6ff
bright5=bb9af7
bright6=0db9d7
bright7=c0caf5

# ── Title bar (only drawn when floated; tiled in niri it's hidden) ───────────
[csd]
size=26
color=1a1b26
button-width=30
button-minimize-color=7aa2f7
button-maximize-color=9ece6a
button-close-color=f7768e

# ── URLs ─────────────────────────────────────────────────────────────────────
[url]
launch=xdg-open ${url}
# Underline OSC-8 hyperlinks always (ls --hyperlink, gh, eza, etc.), not only
# while in url-mode.
osc8-underline=always

[bell]
urgent=no
visual=no

[mouse]
hide-when-typing=yes

# ── Extra key bindings (defaults are kept; these only add) ───────────────────
[key-bindings]
# Enter url-mode but COPY the chosen link instead of opening it.
show-urls-copy=Control+Shift+y
# Dump the whole scrollback into nvim (jump to the end) for searching/yanking.
pipe-scrollback=[sh -c "t=$(mktemp); cat > $t; foot nvim + $t; rm -f $t"] Control+Shift+g

[tweak]
# Repaint only the cells that changed instead of the whole surface — lower GPU
# upload + latency on big bursts of output.
damage-whole-window=no
render-timer=none
