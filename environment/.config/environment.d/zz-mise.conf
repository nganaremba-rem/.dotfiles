# mise shims for GUI apps launched outside a shell (niri launcher, IDEs).
# Named zz- deliberately: environment.d files are read in lexical order and the
# existing path.conf sets PATH absolutely, so anything sorting before it ("p" > "9")
# gets clobbered. This file appends to whatever PATH the earlier files leave.
PATH=$PATH:/home/rem/.local/share/mise/shims
