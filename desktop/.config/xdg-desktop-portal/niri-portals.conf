# Written 2026-08-03. This file exists to win a config lookup.
#
# xdg-desktop-portal uses the FIRST matching config file whole; it does not
# merge. Per directory it tries <desktop>-portals.conf for each name in
# XDG_CURRENT_DESKTOP, then generic portals.conf. Because
# ~/.config/xdg-desktop-portal/portals.conf exists (default=wlr, left over from
# another compositor), it shadowed the packaged
# /usr/share/xdg-desktop-portal/niri-portals.conf, so ScreenCast was served by
# xdg-desktop-portal-wlr - which advertises AvailableSourceTypes=1, MONITOR
# only, no WINDOW. Browsers sharing a whole screen worked; Discord, which wants
# window sources, had nothing to enumerate.
#
# niri publishes org.gnome.Mutter.ScreenCast, which is what
# xdg-desktop-portal-gnome drives, so ScreenCast/Screenshot go there.
# Everything else stays on gtk deliberately: niri's packaged file says
# default=gnome;gtk, but that moves FileChooser to the nautilus-based GNOME
# dialog. default=gtk keeps the existing file dialogs.
#
# Only affects niri sessions. portals.conf, mango-portals.conf and
# hyprland-portals.conf are untouched and still apply to their compositors.
# Roll back: delete this file, then
#   systemctl --user restart xdg-desktop-portal.service

[preferred]
default=gtk
org.freedesktop.impl.portal.ScreenCast=gnome
org.freedesktop.impl.portal.Screenshot=gnome
org.freedesktop.impl.portal.Secret=gnome-keyring
