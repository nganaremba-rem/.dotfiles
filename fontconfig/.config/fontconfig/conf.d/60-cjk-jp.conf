<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Japanese text: Noto CJK JP ahead of MS Gothic / JhengHei, which
       65-nonlatin.conf would otherwise pick, and ahead of the KR/SC variants
       for unified Han. Latin Noto stays first so Latin text is unchanged.
       Lives in conf.d because omarchy-font-set rewrites fonts.conf wholesale. -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Noto Sans</family>
      <family>Noto Sans CJK JP</family>
    </prefer>
  </alias>

  <alias>
    <family>serif</family>
    <prefer>
      <family>Noto Serif</family>
      <family>Noto Serif CJK JP</family>
    </prefer>
  </alias>

  <alias>
    <family>monospace</family>
    <prefer>
      <family>Noto Sans Mono</family>
      <family>Noto Sans Mono CJK JP</family>
    </prefer>
  </alias>

  <!-- Pages that name the MS fonts directly still get them; drop their
       embedded bitmap strikes so small sizes render from outlines. -->
  <match target="font">
    <test name="family" qual="any"><string>MS Gothic</string></test>
    <edit name="embeddedbitmap" mode="assign"><bool>false</bool></edit>
  </match>
  <match target="font">
    <test name="family" qual="any"><string>MS PGothic</string></test>
    <edit name="embeddedbitmap" mode="assign"><bool>false</bool></edit>
  </match>
  <match target="font">
    <test name="family" qual="any"><string>MS UI Gothic</string></test>
    <edit name="embeddedbitmap" mode="assign"><bool>false</bool></edit>
  </match>
</fontconfig>
