# Reflector configuration file for the systemd service.
#
# Empty lines and lines beginning with "#" are ignored.  All other lines should
# contain valid reflector command-line arguments.

# Save the mirrorlist to this location.
--save /etc/pacman.d/mirrorlist

# Only HTTPS mirrors.
--protocol https

# Home region first, well-run global mirrors as fallback.
--country IN,SG,DE,US

# Discard mirrors more than 12 hours out of sync.
--age 12

# Take the 20 freshest candidates, benchmark them, keep the 10 fastest,
# and write them out in measured-speed order.
--latest 20
--fastest 10
--sort rate

# Do not hang on a dead mirror while ranking.
--download-timeout 5
