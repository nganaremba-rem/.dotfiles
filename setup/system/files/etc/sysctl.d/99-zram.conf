# Swap here is zram (compressed RAM), not a disk: swapping is cheap, so prefer
# compressing idle memory over dropping the file cache, and read one page at
# a time. Values from the Arch wiki zram page. Delete this file to undo.
vm.swappiness = 180
vm.page-cluster = 0
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
