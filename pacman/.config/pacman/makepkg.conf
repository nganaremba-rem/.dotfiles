#!/hint/bash
# shellcheck disable=2034
#
# ~/.config/pacman/makepkg.conf
# Sourced after /etc/makepkg.conf and /etc/makepkg.conf.d/*.conf, so nothing
# under /etc needs editing (and no .pacnew churn on system upgrades).

#########################################################################
# TOOLCHAIN: use the distro toolchains, never mise's user-level ones
#########################################################################
# mise prepends ~/.local/share/mise/{installs,shims} to PATH. That is right
# for interactive shells and wrong here: PKGBUILDs call bare `python`, `go`
# and `cargo` and expect the interpreters that makedepends= guarantees.
# Symptom this fixes: "No module named build" from mise's python 3.13, while
# python-build is installed for the system python 3.14.
# Filter by prefix, not by literal path: mise dirs are version-stamped.
PATH="$(printf '%s' "$PATH" | tr ':' '\n' \
        | grep -v "^${HOME}/\.local/share/mise/" | paste -sd:)"
export PATH

# PATH alone is not enough: mise also exports GOROOT/GOBIN pointing into its
# own go install. A distro `go` driver with a mise GOROOT gives
#   compile: version "go1.25.14" does not match go tool version "go1.27.0"
# Drop any toolchain var that still points inside the mise tree.
for _v in GOROOT GOBIN GOPATH RUSTUP_TOOLCHAIN CARGO_HOME PYTHONHOME PYTHONPATH; do
  if [[ ${!_v-} == "${HOME}/.local/share/mise/"* ]]; then
    unset "$_v"
  fi
done
unset _v

#########################################################################
# BUILD PARALLELISM
#########################################################################
# MAKEFLAGS only reaches GNU make. cargo, go and ninja each need their own
# knob, otherwise they fan out to all 12 threads and peg the machine.
MAKEFLAGS="-j4"
NINJAFLAGS="-j4"
export CARGO_BUILD_JOBS=4
export GOMAXPROCS=4

#########################################################################
# BUILD ENVIRONMENT
#########################################################################
# Arrays are replaced wholesale, not merged, so both are written out in full.
# !check  - skip upstream test suites (normal for AUR; big time saver)
# !debug  - no separate -debug packages with full debuginfo
BUILDENV=(!distcc color !ccache !check !sign)
OPTIONS=(strip docs !libtool !staticlibs emptydirs zipman purge !debug lto)

#########################################################################
# GO MODULE CACHE
#########################################################################
# Go creates $GOPATH/pkg/mod as mode 0555. PKGBUILDs that set
# GOPATH="$srcdir"/gopath then leave a src tree makepkg cannot delete, so
# `makepkg -C` dies in cleanup with "Permission denied" and aborts via
# error_function's `kill -SIGUSR1 $$` -- surfacing in yay as the opaque
# "signal: user defined signal 1". -modcacherw makes those dirs writable.
# Arch's Go packaging guidelines require this flag; some PKGBUILDs omit it.
export GOFLAGS="-modcacherw${GOFLAGS:+ $GOFLAGS}"
