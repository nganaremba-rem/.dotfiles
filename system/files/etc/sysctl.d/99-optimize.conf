# --- Memory Management ---
# Lower swappiness: prefer RAM over swap (ZRAM already set up)
vm.swappiness=10
# Keep more dentries/inodes in cache (faster file access)
vm.vfs_cache_pressure=50
# Delay background writeback, batch disk writes
vm.dirty_ratio=10
vm.dirty_background_ratio=3
vm.dirty_expire_centisecs=3000
vm.dirty_writeback_centisecs=1500

# --- CPU / Scheduling ---
# Disable NMI watchdog (unnecessary on desktop, wastes CPU cycles)
kernel.nmi_watchdog=0
# Group tasks by session for better interactive response
kernel.sched_autogroup_enabled=1

# --- OOM Killer ---
# Kill the task causing OOM, not random victims
vm.oom_kill_allocating_task=1

# --- Network (minor memory savings) ---
net.core.rmem_default=262144
net.core.wmem_default=262144
