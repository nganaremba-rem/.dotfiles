# System hardening (Balanced profile) — added by Claude Code system-hardening
# Reverse: delete this file and run `sudo sysctl --system`
# See ~/system-hardening/README.md

## --- Network stack hardening ---
# Reverse-path filtering (drop spoofed packets)
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1
# Ignore ICMP redirects (prevents MITM route injection)
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
# Reject source-routed packets
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0
# Log impossible (spoofed) addresses
net.ipv4.conf.all.log_martians = 1
# Don't respond to broadcast pings / bogus ICMP
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.icmp_ignore_bogus_error_responses = 1
# SYN flood protection
net.ipv4.tcp_syncookies = 1

## --- Kernel hardening ---
# Hide kernel pointers from non-root (anti-exploit)
kernel.kptr_restrict = 2
# Restrict dmesg to root
kernel.dmesg_restrict = 1
# Quieter console logging
kernel.printk = 3 3 3 3
# Block runtime loading of a new kernel via kexec
kernel.kexec_load_disabled = 1
# Only let a process debug its own children (Yama)
kernel.yama.ptrace_scope = 1
# Lock down unprivileged eBPF (the AUR rootkit used eBPF)
kernel.unprivileged_bpf_disabled = 1
net.core.bpf_jit_harden = 2
# Restrict perf subsystem
kernel.perf_event_paranoid = 3

## --- Filesystem hardening ---
fs.protected_hardlinks = 1
fs.protected_symlinks = 1
fs.protected_fifos = 2
fs.protected_regular = 2
fs.suid_dumpable = 0

# NOTE: user namespaces are deliberately LEFT ENABLED so Chrome/Brave/
# Flatpak/firejail sandboxes keep working.
