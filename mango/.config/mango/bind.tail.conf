
# ── Hand-written binds, appended to the generated bind.conf ──
# A comment line right above a bind is its title in the Mod+F1 list. Keep titles short.

# Mouse buttons (same as niri: Mod+drag moves, Mod+right-drag resizes)
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

# Touchpad gestures
gesturebind=none,left,3,focusdir,left
gesturebind=none,right,3,focusdir,right
gesturebind=none,up,3,focusdir,up
gesturebind=none,down,3,focusdir,down
gesturebind=none,right,4,viewprev_have_client
gesturebind=none,left,4,viewnext_have_client
gesturebind=none,up,4,enteroverview
gesturebind=none,down,4,leaveoverview

# 📥 Send window to scratchpad
bind=SUPER+ALT,s,minimized
# 📤 Take window out of scratchpad
bind=SUPER+ALT+SHIFT,s,restore_minimized
# 📥 Show or hide scratchpad
bind=SUPER,grave,toggle_scratchpad

# 🔄 Reload mango config
bind=SUPER+SHIFT+ALT,r,reload_config

# 📌 Scratchpad terminal (reused window, not a new one each time)
bind=SUPER,Apostrophe,toggle_named_scratchpad,scratchpad,none,footclient --app-id=scratchpad
# 🏷️ Jump to a window by its letter label
bind=SUPER,Tab,togglejump
# 🧩 Cycle layout: scroller, tile, grid, monocle, deck, center
bind=SUPER,Backslash,switch_layout
# 🗂️ Special tag overlay: show or hide
bind=SUPER+CTRL,grave,toggle_special_tag
# 🗂️ Send window to or from the special tag
bind=SUPER+CTRL+SHIFT,grave,tag_special_tag
# 📍 Pin window to every tag
bind=SUPER+SHIFT,g,toggleglobal
# ⬆️ Keep window always on top
bind=SUPER+SHIFT,y,toggleoverlay
# 📁 Yazi scratchpad (reused window)
bind=SUPER+CTRL,apostrophe,toggle_named_scratchpad,scratchpad-yazi,none,footclient --app-id=scratchpad-yazi -e yazi
# 🎈 Float or tile every window on this tag
bind=SUPER,F2,toggle_all_floating
