# More option see https://github.com/DreamMaoMao/mango/wiki/

# Window effect
blur=1
blur_layer=0
blur_optimized=1
blur_params_num_passes = 2
blur_params_radius = 5
blur_params_noise = 0.02
blur_params_brightness = 0.9
blur_params_contrast = 0.9
blur_params_saturation = 1.2

shadows = 1
layer_shadows = 0
shadow_only_floating = 1
shadows_size = 10
shadows_blur = 15
shadows_position_x = 0
shadows_position_y = 0
shadowscolor= 0x000000ff

border_radius=10
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=1.0



# Animation Configuration(support type:zoom,slide)
# tag_animation_direction: 1-horizontal,0-vertical
animations=1
layer_animations=1
animation_type_open=slide
animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.4
zoom_end_ratio=0.8
fadein_begin_opacity=0.5
fadeout_begin_opacity=0.8
animation_duration_move=500
animation_duration_open=200
animation_duration_tag=350
animation_duration_close=50
animation_duration_focus=0
animation_curve_open=0.46,1.0,0.29,1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
# animation_curve_close=0.08,0.92,0,1
animation_curve_close=0,0,0,0
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opafadeout=0.5,0.5,0.5,0.5
animation_curve_opafadein=0.46,1.0,0.29,1

# Scroller Layout Setting
scroller_structs=20
scroller_default_proportion=0.5
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=0
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0

# Master-Stack Layout Setting
new_is_master=1
default_mfact=0.55
default_nmaster=1
smartgaps=0

# Overview Setting
hotarea_size=10
enable_hotarea=0
ov_tab_mode=0
overviewgappi=5
overviewgappo=30

# Misc
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
idleinhibit_ignore_visible=0
sloppyfocus=1
warpcursor=1
focus_cross_monitor=0
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
cursor_size=24
drag_tile_to_tile=1

# keyboard
repeat_rate=50
repeat_delay=200
numlockon=0
xkb_rules_layout=us
# xkb_rules_variant=,dvorak
# xkb_rules_options=grp:lalt_lshift_toggle

# Trackpad
# need relogin to make it apply
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=0
disable_while_typing=1
left_handed=0
middle_button_emulation=0
swipe_min_threshold=1

# mouse
# need relogin to make it apply
mouse_natural_scrolling=0

# Appearance
gappih=5
gappiv=5
gappoh=10
gappov=1
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
borderpx=4
rootcolor=0x201b14ff
bordercolor=0x444444ff
focuscolor=0xc9b890ff
maximizescreencolor=0x89aa61ff
urgentcolor=0xad401fff
scratchpadcolor=0x516c93ff
globalcolor=0xb153a7ff
overlaycolor=0x14a57cff

# layout support:
# tile,scroller,grid,deck,monocle,center_tile,vertical_tile,vertical_scroller
tagrule=id:1,layout_name:scroller
tagrule=id:2,layout_name:scroller
tagrule=id:3,layout_name:scroller
tagrule=id:4,layout_name:scroller
tagrule=id:5,layout_name:scroller
tagrule=id:6,layout_name:scroller
tagrule=id:7,layout_name:scroller
tagrule=id:8,layout_name:scroller
tagrule=id:9,layout_name:scroller

# Key Bindings
# key name refer to `xev` or `wev` command output,
# mod keys name: super,ctrl,alt,shift,none

# reload config
bind=SUPER,r,reload_config

# Layouts
bind=SUPER+CTRL+ALT,t,setlayout,tile
bind=SUPER+CTRL+ALT,s,setlayout,scroller
bind=SUPER+CTRL+ALT,m,setlayout,monocle
bind=SUPER+CTRL+ALT,g,setlayout,grid
bind=SUPER+CTRL+ALT,d,setlayout,deck
bind=SUPER+CTRL+ALT,c,setlayout,center_tile
bind=SUPER+CTRL+ALT,v,setlayout,vertical_tile
bind=SUPER+CTRL+ALT+SHIFT,s,setlayout,vertical_scroller
bind=SUPER+CTRL+ALT+SHIFT,g,setlayout,vertical_grid
bind=SUPER+CTRL+ALT+SHIFT,d,setlayout,vertical_deck
bind=SUPER+CTRL+ALT+SHIFT,t,setlayout,tgmix

# menu and terminal
# bind=SUPER,space,spawn,rofi -show drun
bind=SUPER,Return,spawn,foot

# exit
bind=ALT,q,quit
bind=SUPER,w,killclient,

# switch window focus
bind=SUPER,Tab,focusstack,next
bind=SUPER,h,focusdir,left
bind=SUPER,l,focusdir,right
bind=SUPER,k,focusdir,up
bind=SUPER,j,focusdir,down

# swap window
bind=SUPER+CTRL,k,exchange_client,up
bind=SUPER+CTRL,j,exchange_client,down
bind=SUPER+CTRL,h,exchange_client,left
bind=SUPER+CTRL,l,exchange_client,right

# switch window status
bind=SUPER,g,toggleglobal,
bind=SUPER,o,toggleoverview,
bind=SUPER,backslash,togglefloating,
bind=SUPER,f,togglemaximizescreen,
bind=SUPER+SHIFT,f,togglefullscreen,
bind=ALT+SHIFT,f,togglefakefullscreen,
bind=SUPER,i,minimized,
bind=SUPER,t,toggleoverlay,
bind=SUPER+SHIFT,I,restore_minimized
bind=ALT,z,toggle_scratchpad

# scroller layout
bind=ALT,e,set_proportion,1.0
bind=ALT,x,switch_proportion_preset,

# switch layout
bind=SUPER,n,switch_layout

# tag switch
bind=SUPER,Left,viewtoleft,0
bind=CTRL,Left,viewtoleft_have_client,0
bind=SUPER,Right,viewtoright,0
bind=CTRL,Right,viewtoright_have_client,0
bind=CTRL+SUPER,Left,tagtoleft,0
bind=CTRL+SUPER,Right,tagtoright,0

bind=Ctrl,1,view,1,0
bind=Ctrl,2,view,2,0
bind=Ctrl,3,view,3,0
bind=Ctrl,4,view,4,0
bind=Ctrl,5,view,5,0
bind=Ctrl,6,view,6,0
bind=Ctrl,7,view,7,0
bind=Ctrl,8,view,8,0
bind=Ctrl,9,view,9,0

# tag: move client to the tag and focus it
# tagsilent: move client to the tag and not focus it
# bind=Alt,1,tagsilent,1
bind=Alt,1,tag,1,0
bind=Alt,2,tag,2,0
bind=Alt,3,tag,3,0
bind=Alt,4,tag,4,0
bind=Alt,5,tag,5,0
bind=Alt,6,tag,6,0
bind=Alt,7,tag,7,0
bind=Alt,8,tag,8,0
bind=Alt,9,tag,9,0

# monitor switch
bind=SUPER+shift,h,focusmon,left
bind=SUPER+shift,l,focusmon,right
bind=SUPER+shift,j,focusmon,down
bind=SUPER+shift,k,focusmon,up
bind=SUPER+CTRL+SHIFT,h,tagmon,left
bind=SUPER+CTRL+SHIFT,l,tagmon,right
bind=SUPER+CTRL+SHIFT,j,tagmon,down
bind=SUPER+CTRL+SHIFT,k,tagmon,up

# gaps
bind=ALT+SHIFT,X,incgaps,1
bind=ALT+SHIFT,Z,incgaps,-1
bind=ALT+SHIFT,R,togglegaps

# movewin
bind=CTRL+SHIFT,k,movewin,+0,-50
bind=CTRL+SHIFT,j,movewin,+0,+50
bind=CTRL+SHIFT,h,movewin,-50,+0
bind=CTRL+SHIFT,l,movewin,+50,+0

# resizewin
bind=CTRL+ALT,Up,resizewin,+0,-50
bind=CTRL+ALT,Down,resizewin,+0,+50
bind=SUPER,minus,resizewin,-50,+0
bind=SUPER,equal,resizewin,+50,+0

# Mouse Button Bindings
# btn_left and btn_right can't bind none mod key
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=NONE,btn_middle,togglemaximizescreen,0
mousebind=SUPER,btn_right,moveresize,curresize

# My keybinds

bind=SUPER,E ,spawn ,nautilus
bind=SUPER,B ,spawn ,google-chrome-stable --new-window
bind=SUPER,A ,spawn ,google-chrome-stable --app=https://chatgpt.com
bind=SUPER+Alt,P ,spawn ,google-chrome-stable --app=https://perplexity.ai/
bind=SUPER+Shift,E ,spawn ,google-chrome-stable --app=https://mail.google.com/mail/u/nganaremba@gmail.com
bind=SUPER,Y ,spawn ,google-chrome-stable --app=https://youtube.com
bind=SUPER+Shift,G ,spawn ,google-chrome-stable --app=https://web.whatsapp.com
bind=SUPER+Alt,N ,spawn ,google-chrome-stable --app=https://netflix.com
bind=SUPER+Alt,H ,spawn ,google-chrome-stable --app=https://hotstar.com
bind=SUPER+Ctrl,N ,spawn ,~/bin/arch/toggle-gammastep
bind=SUPER,Delete ,spawn ,wlogout
# // SUPER,Space ,spawn ,fuzzel
# // SUPER,Space ,spawn,  qs -c noctalia-shell ipc call launcher toggle
bind=SUPER,Space,spawn,rofi -show drun -theme ~/.config/rofi/launchers/type-2/style-2.rasi
# // SUPER+Alt,Space ,spawn ,~/.local/share/omarchy/bin/omarchy-menu
bind=SUPER+Alt,Space ,spawn,  rofi -show window -theme ~/.config/rofi/launchers/type-2/style-2.rasi
bind=Ctrl+SUPER+Alt,L ,spawn ,systemctl suspend
bind=SUPER+Shift,T ,spawn ,~/.local/bin/kitty -e bash -c btop
bind=SUPER+Ctrl+Alt,V ,spawn ,~/.local/bin/kitty -e bash -c wiremix
bind=SUPER,V ,spawn,  kitty ~/.config/cliphist/cliphist
# // SUPER+Ctrl,E ,spawn ,~/.local/bin/emoji-picker
# // SUPER+Ctrl,E ,spawn,  qs -c noctalia-shell ipc call launcher emoji
bind=SUPER+Ctrl,E ,spawn,  rofi -show emoji -theme ~/.config/rofi/launchers/type-2/style-2.rasi
# // SUPER+Ctrl+Alt,B ,spawn ,~/.local/bin/wallpaper-picker.sh
# // SUPER+Ctrl+Alt,B ,spawn,  qs -c noctalia-shell ipc call wallpaper toggle
bind=SUPER+Ctrl+Alt,B ,spawn,  ~/.config/wallpaper/set-wallpaper.sh
bind=SUPER+Ctrl+Alt,N ,spawn ,swaync-client -t -sw
bind=SUPER,Apostrophe ,spawn ,~/.local/bin/kitty
bind=SUPER,Slash ,spawn ,ghostty
bind=SUPER+Ctrl+Alt,W ,spawn,  rfkill unblock wifi && ~/.local/bin/kitty -e bash -c impala 
bind=SUPER+Ctrl,W ,spawn,  pkill waybar; systemctl --user restart waybar
# bind=SUPER+Ctrl,X ,spawn ,voxtype-record-toggle
bind=SUPER+Alt,C ,spawn ,google-chrome-stable --app=https://claude.ai/chat
bind=SUPER,X ,spawn ,google-chrome-stable --app=https://x.com
bind=SUPER+Alt,K ,spawn ,~/.local/bin/remtui
bind=SUPER,Print,spawn_shell,FILE="$HOME/Pictures/Screenshots/GRIM-$(date +%Y-%m-%d_%H-%M-%S).png"; grim -g "$(slurp)" "$FILE" && wl-copy < "$FILE" && notify-send -i "$FILE" "Screenshot saved!" "$FILE"
bind=CTRL,Print,spawn_shell,FILE="$HOME/Pictures/Screenshots/GRIM-$(date +%Y-%m-%d_%H-%M-%S).png"; grim -g "$(slurp -o)" "$FILE" && notify-send -i "$FILE" "Screenshot saved" "$FILE" && wl-copy < "$FILE"

# Axis Bindings
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client


# layer rule
layerrule=animation_type_open:zoom,layer_name:rofi
layerrule=animation_type_close:zoom,layer_name:rofi


# Enviroment variables
env=QT_QPA_PLATFORM,"wayland"
env=WLR_RENDERER,"vulkan"
# env=WLR_NO_HARDWARE_CURSORS,"1"
env=GTK_USE_PORTAL,"0"
env=XCURSOR_THEME,"Bibata-Modern-Ice"
env=XCURSOR_SIZE,"24"
env=OMARCHY_PATH,"~/.local/share/omarchy"
env=MOZC_ENABLE_WAYLAND,"1"
# env=XDG_CURRENT_DESKTOP,"mango"
# env=XDG_SESSION_DESKTOP,"mango"

# Autostart
exec-once=/usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once=$HOME/.config/rofi/restore-wallpaper.sh
exec-once=fcitx5 -dr
exec-once=export $(gnome-keyring-daemon --start --components=pkcs11,secrets,ssh)
exec-once=gammastep -O 4500
exec-once=waybar
exec-once=wl-clip-persist --clipboard regular
exec-once=wl-paste --watch cliphist store
exec-once=~/.config/session/init.sh
exec-once=/usr/lib/xdg-desktop-portal-wlr &


# Monitor
monitorrule=name:^eDP-1$,width:1920,height:1080,refresh:60,x:1044,y:1080
monitorrule=name:^DP-2$,width:1920,height:1080,refresh:100,x:0,y:0
monitorrule=name:^DP-3$,width:1920,height:1080,refresh:100,x:1920,y:0

# Tearing
# allow_tearing=1


# Game smooth
syncobj_enable=1
