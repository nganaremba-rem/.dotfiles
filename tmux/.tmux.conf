##### ===============================
##### 🧠 CORE
##### ===============================

# Terminal support
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:RGB"

# Performance
set -sg escape-time 10

# Indexing
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Clipboard + mouse
set -g set-clipboard on
set -g mouse on

##### ===============================
##### ⌨️ KEYBINDS
##### ===============================

# Unbind old prefix
unbind C-b

# Set Ctrl+; as prefix
# set -g prefix C-a
set -g prefix C-q

# Allow sending prefix inside nested tmux
# bind-key C-a send-prefix
bind-key C-q


# Prefix
# unbind-key C-b
# set -g prefix C-a
# bind-key C-a send-prefix

# Reload
bind-key r source-file ~/.tmux.conf \; display-message "Reloaded"

# Splits (current dir)
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Layouts
bind-key v select-layout even-vertical
bind-key h select-layout even-horizontal

# Resize
bind -n M-h resize-pane -L 2
bind -n M-j resize-pane -D 2
bind -n M-k resize-pane -U 2
bind -n M-l resize-pane -R 2

# Swap windows
bind -r "<" swap-window -d -t -1
bind -r ">" swap-window -d -t +1

# Popup
bind P display-popup

# Lazygit popup
bind g display-popup \
  -d "#{pane_current_path}" \
  -w 90% \
  -h 90% \
  -E 'lazygit'

# New session
bind N command-prompt -p 'Session:' 'new-session -s "%%"'

##### ===============================
##### 📝 COPY MODE (VIM)
##### ===============================

setw -g mode-keys vi

bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel
bind-key -T copy-mode-vi J send-keys -X page-up
bind-key -T copy-mode-vi K send-keys -X page-down

##### ===============================
##### 🧩 STATUS BAR
##### ===============================

set -g status-position top
set -g status-left-length 100
set -g status-right-length 100

##### ===============================
##### 🎨 CATPPUCCIN (YOUR STYLE)
##### ===============================

# plugin manager
set -g @plugin 'tmux-plugins/tpm'

# catppuccin plugin (same approach as yours)
set -g @plugin 'catppuccin/tmux'

# theme options
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_flags "text"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"

# load theme EXACTLY like you did
run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

# your status config
set -g status-left "#{E:@catppuccin_status_session}"
set -g status-right "#{E:@catppuccin_status_application}#{E:@catppuccin_status_directory}#{E:@catppuccin_status_date_time}"

##### ===============================
##### 🔥 TRANSPARENCY FIX (CRITICAL)
##### ===============================

# MUST be after catppuccin

# remove ALL backgrounds
set -g status-style "bg=default"
set -g window-style "bg=default"
set -g window-active-style "bg=default"

# fix borders (catppuccin colors)
set -g pane-border-style "fg=#6c7086,bg=default"
set -g pane-active-border-style "fg=#89b4fa,bg=default"

# override catppuccin internals
set -g @catppuccin_status_background "default"
set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_current_fill "number"

##### ===============================
##### 🔌 OTHER PLUGINS
##### ===============================

set -g @plugin 'christoomey/vim-tmux-navigator'

##### ===============================
##### TMUX OPEN
##### ===============================
set -g @plugin 'tmux-plugins/tmux-open'

##### ===============================
##### 🚀 TPM INIT
##### ===============================

run '~/.tmux/plugins/tpm/tpm'

