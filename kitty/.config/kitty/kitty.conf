# /* ---- 💫 https://github.com/JaKooLit 💫 ---- */  #
include ./themes/mocha.conf

# ── Colors (Tokyo Night) ─────────────────────────────────────────────────────
foreground #a9b1d6
background #1a1b26
selection_foreground #c0caf5
selection_background #7aa2f7

cursor #c0caf5
cursor_text_color #1a1b26

active_border_color #7aa2f7
active_tab_background #7aa2f7

color0  #32344a
color1  #f7768e
color2  #9ece6a
color3  #e0af68
color4  #7aa2f7
color5  #ad8ee6
color6  #449dab
color7  #787c99
color8  #444b6a
color9  #ff7a93
color10 #b9f27c
color11 #ff9e64
color12 #7da6ff
color13 #bb9af7
color14 #0db9d7
color15 #acb0d0

# ── Font ─────────────────────────────────────────────────────────────────────
font_family      CaskaydiaCove Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        14.5

# ── Performance (critical for neovim) ────────────────────────────────────────
# Sync repaints to monitor vsync — eliminates tearing when scrolling in neovim
sync_to_monitor yes

# Max repaint interval. 8ms = ~125fps. Default 10ms (100fps) is noticeable
# on 144Hz monitors. Lower = smoother, slightly more CPU.
repaint_delay 8

# Delay before processing keyboard input. Default 3ms causes visible lag
# when holding h/l/j/k in neovim. 0 = respond immediately.
input_delay 0

# Use xterm-kitty so neovim gets kitty's full terminfo: synchronized output,
# undercurl, RGB colors without guessing. Use xterm-256color only for SSH.
term xterm-kitty

# ── Appearance ───────────────────────────────────────────────────────────────
background_opacity 0.8
background_blur 1
dynamic_background_opacity yes
window_padding_width 14
window_padding_height 14

cursor_shape block
# cursor_trail removed — redraws the cursor path on every keypress,
# adds measurable GPU overhead during fast neovim navigation

linux_display_server wayland

# ── Scrollback ───────────────────────────────────────────────────────────────
scrollback_lines 10000
wheel_scroll_min_lines 1

# ── Bells & selection ────────────────────────────────────────────────────────
enable_audio_bell no
selection_foreground none
selection_background none
clipboard_control write-clipboard write-primary read-clipboard-ask

# ── Tab bar ──────────────────────────────────────────────────────────────────
tab_bar_edge        bottom
tab_bar_style       powerline
tab_powerline_style slanted
tab_title_template  {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}

# ── Misc ─────────────────────────────────────────────────────────────────────
confirm_os_window_close 0
single_instance yes
allow_remote_control yes
close_on_child_death yes

# ── Keybindings ──────────────────────────────────────────────────────────────
map F11          toggle_fullscreen
map ctrl+insert  copy_to_clipboard
map shift+insert paste_from_clipboard
map ctrl+d       no_op
